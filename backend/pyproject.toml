[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgtrace-app"
version = "1.0.0.dev0"
description = "字段溯源工作台正式服务"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "asyncmy==0.2.9",
  "greenlet==3.1.1",
  "sqlglot==30.16.0",
  "rdflib>=7,<8",
  "jsonschema>=4.23,<5",
  "httpx==0.28.1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "aiosqlite==0.20.0",
]

[project.scripts]
sgtrace-app = "sgtrace_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
